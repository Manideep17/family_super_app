# Runs the backend test suites (functions/test/) on every push that touches
# the backend, and on every pull request — separate from deploy-firebase.yml
# (manual-only, deploys to the live project) so a regression is caught
# immediately, not just at the moment you happen to deploy.
#
# Two suites, see functions/test/README.md for what each actually checks:
#   - `npm test` (logic.test.js) — runs the real compiled Cloud Functions
#     handlers against an in-memory Firestore/Auth stand-in. No emulator,
#     no external network needed.
#   - `npm run test:rules` (rules/rules.test.mjs) — runs the actual
#     Firestore Rules through @firebase/rules-unit-testing's real emulator.
#     This needs Java 21 (via actions/setup-java below) and network access
#     to download the emulator jar on first run — neither was available in
#     the sandbox this suite was originally written in, so this workflow is
#     also the first real execution of it.
name: Functions CI

on:
  push:
    branches: [main, master]
    paths:
      - "functions/**"
      - "firestore.rules"
      - ".github/workflows/functions-ci.yml"
  pull_request:
    paths:
      - "functions/**"
      - "firestore.rules"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Function logic tests (real compiled handlers, in-memory Firestore stand-in)
        working-directory: functions
        run: npm test

      - name: Install firebase-tools (for the Rules emulator)
        run: npm install -g firebase-tools

      - name: Firestore Rules tests (real emulator)
        working-directory: functions
        run: npm run test:rules
