# Deploys Cloud Functions + Firestore rules/indexes + Storage rules to your
# live Firebase project.
#
# Runs automatically on every push to main/master that touches functions/**,
# firestore.rules, firestore.indexes.json, or storage.rules — so a rules or
# Cloud Function change is live the moment it's merged, no manual "Run
# workflow" click needed. (Still keeps workflow_dispatch too, for a manual
# full redeploy any time.) Gated behind the same `npm test` step as before —
# a failing backend test still blocks the deploy, on autorun or manual.
#
# One-time setup before the first run (all free — a service account key
# costs nothing, this just lets GitHub authenticate as your project):
#   1. Google Cloud Console -> IAM & Admin -> Service Accounts -> Create.
#      Grant it "Firebase Admin" (simplest) or, for a tighter scope,
#      "Cloud Functions Admin" + "Firebase Rules Admin" + "Service Account
#      User" + "Cloud Datastore Index Admin".
#   2. Open the new service account -> Keys -> Add key -> Create new key ->
#      JSON. This downloads a .json file — never commit it.
#   3. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret -> name it FIREBASE_SERVICE_ACCOUNT -> paste
#      the entire JSON file contents as the value.
#
# If that secret isn't set yet, the auto-triggered run logs a clear message
# and skips deploying (instead of failing red) — see the "Deploy" step below.
name: Deploy Firebase Backend

on:
  push:
    branches: [main, master]
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "storage.rules"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated firebase deploy --only targets"
        required: false
        type: string
        default: "functions,firestore:rules,firestore:indexes,storage"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Run function logic tests
        working-directory: functions
        run: npm test

      - name: Authenticate to Google Cloud
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "No FIREBASE_SERVICE_ACCOUNT secret set — skipping deploy."
            echo "Add it under Settings -> Secrets and variables -> Actions (see the comment at the top of this file), then push again or re-run this workflow."
            exit 0
          fi
          npm install -g firebase-tools
          firebase deploy \
            --only "${{ inputs.targets || 'functions,firestore:rules,firestore:indexes,storage' }}" \
            --project family-super-app-3bf1c \
            --non-interactive \
            --force
