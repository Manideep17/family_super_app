# Builds a release APK when you push to main/master, or when you click "Run workflow".
# After it finishes: Actions → this workflow → latest run → Artifacts → app-release-apk (zip with APK).
# Manual runs: optional booleans add common AppFlags (--dart-define).
#
# Release signing (needed for Google Sign-In — see docs/RELEASE_SIGNING.md):
# without these 4 secrets, this falls back to Gradle's auto-generated debug
# keystore, which is DIFFERENT on every CI run — so Google Sign-In will
# always fail with ApiException: 10 (DEVELOPER_ERROR) no matter what's
# registered in Firebase, since there's nothing stable to register.
#   1. On your machine, base64-encode the keystore you already generated:
#        base64 -i android/app/upload-keystore.jks | pbcopy   (macOS)
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> add:
#        ANDROID_KEYSTORE_BASE64   (the base64 string from step 1)
#        ANDROID_KEYSTORE_PASSWORD (storePassword from android/key.properties)
#        ANDROID_KEY_ALIAS         (keyAlias, e.g. "upload")
#        ANDROID_KEY_PASSWORD      (keyPassword from android/key.properties)
#   3. Run this workflow once — the "Configure release signing" step below
#      prints the SHA-1/SHA-256 fingerprint in its log (safe to read/copy,
#      fingerprints aren't secrets). Register that in Firebase Console ->
#      Project settings -> your Android app -> Add fingerprint, then
#      download the refreshed google-services.json and replace
#      android/app/google-services.json in the repo.
#
# Auto-delivery to your phone (Firebase App Distribution): every build made
# by this workflow is pushed straight to your phone as an update — no more
# manually downloading the artifact zip. One-time setup:
#   1. Install the "Firebase App Tester" app from the Play Store on your
#      phone (search "Firebase App Tester").
#   2. The first time this workflow runs after this comment was added,
#      Firebase emails manideepbiswas21@gmail.com an invite. Open that email
#      on the phone and accept it in the App Tester app.
#   3. Reuses the same FIREBASE_SERVICE_ACCOUNT secret already set up for
#      deploy-firebase.yml — no new secret needed, as long as that service
#      account has the "Firebase App Distribution Admin" role (Firebase
#      Admin already includes it).
# After that, every push to main/master (or manual run) shows up as an
# update notification in the App Tester app within a minute or two of the
# build finishing.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      functions_enabled:
        description: Pass FUNCTIONS_ENABLED=true (Function-backed UI surfaces)
        required: false
        type: boolean
        default: false
      media_uploads_enabled:
        description: Pass MEDIA_UPLOADS_ENABLED=true (diary/avatar/vault/reel uploads — still needs Cloudinary if used)
        required: false
        type: boolean
        default: false
      ai_digest_enabled:
        description: Pass AI_DIGEST_ENABLED=true (Gemini weekly digest — needs AI Logic set up first, see docs/AI_LOGIC_SETUP.md)
        required: false
        type: boolean
        default: false
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building with the Gradle debug-keystore fallback."
            echo "Google Sign-In will keep failing (ApiException: 10) until the release keystore secrets are added — see the comment at the top of this workflow file."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
          echo "Release keystore configured. Fingerprint (register in Firebase Console -> Project settings -> your Android app -> Add fingerprint, if not already registered):"
          keytool -list -v -keystore android/app/upload-keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:"

      - name: Dependencies & APK
        run: |
          flutter pub get
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.functions_enabled }}" = "true" ]; then
              FLAGS="$FLAGS --dart-define=FUNCTIONS_ENABLED=true"
            fi
            if [ "${{ inputs.media_uploads_enabled }}" = "true" ]; then
              FLAGS="$FLAGS --dart-define=MEDIA_UPLOADS_ENABLED=true"
            fi
            if [ "${{ inputs.ai_digest_enabled }}" = "true" ]; then
              FLAGS="$FLAGS --dart-define=AI_DIGEST_ENABLED=true"
            fi
          fi
          flutter build apk --release ${FLAGS}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Authenticate to Google Cloud
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Distribute to phone (Firebase App Distribution)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app 1:679019957650:android:8c6cb7576949211947c54b \
            --project family-super-app-3bf1c \
            --testers "manideepbiswas21@gmail.com" \
            --release-notes "Auto build from ${{ github.sha }}"
