# Builds a release APK when you push to main/master, or when you click "Run workflow".
# After it finishes: Actions → this workflow → latest run → Artifacts → app-release-apk (zip with APK).
#
# Every build (push or manual) now enables all AppFlags by default —
# FUNCTIONS_ENABLED, MEDIA_UPLOADS_ENABLED, AI_DIGEST_ENABLED — plus passes
# OneSignal push-bridge config from repo secrets as dart-defines, so the
# built APK has every feature switched on with no manual step. Manual runs
# can still uncheck any of the three boxes to build with a feature off
# (e.g. to isolate a bug), but the default is "everything on."
#
# NOTE: Functions-backed features (leaderboard, best moments, AI quiz,
# account deletion, billing, referrals) only actually work once the backend
# itself is deployed — see deploy-firebase.yml, which now also auto-deploys
# on push. AI digest additionally needs the one-time AI Logic console setup
# in docs/AI_LOGIC_SETUP.md. Media uploads (diary/avatar/vault/reel) go
# straight to this project's Firebase Storage bucket (storage.rules) — no
# extra secrets needed, just the Blaze plan (Storage has no free tier).
#
# Release signing (needed for Google Sign-In — see docs/RELEASE_SIGNING.md):
# without these 4 secrets, this falls back to Gradle's auto-generated debug
# keystore, which is DIFFERENT on every CI run — so Google Sign-In will
# always fail with ApiException: 10 (DEVELOPER_ERROR) no matter what's
# registered in Firebase, since there's nothing stable to register.
#   1. On your machine, base64-encode the keystore you already generated:
#        base64 -i android/app/upload-keystore.jks | pbcopy   (macOS)
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions -> add:
#        ANDROID_KEYSTORE_BASE64   (the base64 string from step 1)
#        ANDROID_KEYSTORE_PASSWORD (storePassword from android/key.properties)
#        ANDROID_KEY_ALIAS         (keyAlias, e.g. "upload")
#        ANDROID_KEY_PASSWORD      (keyPassword from android/key.properties)
#   3. Run this workflow once — the "Configure release signing" step below
#      prints the SHA-1/SHA-256 fingerprint in its log (safe to read/copy,
#      fingerprints aren't secrets). Register that in Firebase Console ->
#      Project settings -> your Android app -> Add fingerprint, then
#      download the refreshed google-services.json and replace
#      android/app/google-services.json in the repo.
#
# Auto-delivery to your phone (Firebase App Distribution): every build made
# by this workflow is pushed straight to your phone as an update — no more
# manually downloading the artifact zip. One-time setup:
#   1. Install the "Firebase App Tester" app from the Play Store on your
#      phone (search "Firebase App Tester").
#   2. The first time this workflow runs after this comment was added,
#      Firebase emails manideepbiswas21@gmail.com an invite. Open that email
#      on the phone and accept it in the App Tester app.
#   3. Reuses the same FIREBASE_SERVICE_ACCOUNT secret already set up for
#      deploy-firebase.yml — no new secret needed, as long as that service
#      account has the "Firebase App Distribution Admin" role (Firebase
#      Admin already includes it).
# After that, every push to main/master (or manual run) shows up as an
# update notification in the App Tester app within a minute or two of the
# build finishing.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      functions_enabled:
        description: Include FUNCTIONS_ENABLED=true (Function-backed UI surfaces)
        required: false
        type: boolean
        default: true
      media_uploads_enabled:
        description: Include MEDIA_UPLOADS_ENABLED=true (diary/avatar/vault/reel uploads to Firebase Storage)
        required: false
        type: boolean
        default: true
      ai_digest_enabled:
        description: Include AI_DIGEST_ENABLED=true (Gemini weekly digest — needs AI Logic set up first, see docs/AI_LOGIC_SETUP.md)
        required: false
        type: boolean
        default: true
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building with the Gradle debug-keystore fallback."
            echo "Google Sign-In will keep failing (ApiException: 10) until the release keystore secrets are added — see the comment at the top of this workflow file."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS
          echo "Release keystore configured. Fingerprint (register in Firebase Console -> Project settings -> your Android app -> Add fingerprint, if not already registered):"
          keytool -list -v -keystore android/app/upload-keystore.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:"

      - name: Dependencies & APK
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          PUSH_WORKER_ENDPOINT: ${{ secrets.PUSH_WORKER_ENDPOINT }}
          PUSH_WORKER_KEY: ${{ secrets.PUSH_WORKER_KEY }}
        run: |
          flutter pub get

          # Default every flag to ON. On a workflow_dispatch run, an
          # explicit "false" checkbox turns that one flag back off; a plain
          # push (the normal flow) always gets all three, matching the
          # boolean inputs' own defaults above.
          functions_on=true
          media_on=true
          ai_on=true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.functions_enabled }}" = "false" ] && functions_on=false
            [ "${{ inputs.media_uploads_enabled }}" = "false" ] && media_on=false
            [ "${{ inputs.ai_digest_enabled }}" = "false" ] && ai_on=false
          fi

          FLAGS=""
          [ "$functions_on" = "true" ] && FLAGS="$FLAGS --dart-define=FUNCTIONS_ENABLED=true"
          [ "$media_on" = "true" ] && FLAGS="$FLAGS --dart-define=MEDIA_UPLOADS_ENABLED=true"
          [ "$ai_on" = "true" ] && FLAGS="$FLAGS --dart-define=AI_DIGEST_ENABLED=true"

          # OneSignal config — safe to pass even when the secret isn't set
          # yet (just compiles in an empty string, so
          # AppFlags.pushBridgeConfigured stays false until it's added).
          FLAGS="$FLAGS --dart-define=ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID}"
          FLAGS="$FLAGS --dart-define=PUSH_WORKER_ENDPOINT=${PUSH_WORKER_ENDPOINT}"
          FLAGS="$FLAGS --dart-define=PUSH_WORKER_KEY=${PUSH_WORKER_KEY}"

          flutter build apk --release ${FLAGS}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Authenticate to Google Cloud
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Distribute to testers (Firebase App Distribution)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          # Set this as a repo Variable (Settings -> Secrets and variables ->
          # Actions -> Variables tab, NOT Secrets — it's not sensitive) once
          # you've created a tester group of the same name in Firebase
          # Console -> App Distribution -> Testers & Groups. Until then this
          # falls back to the one email that was always hardcoded here.
          APP_DISTRIBUTION_GROUP: ${{ vars.APP_DISTRIBUTION_GROUP }}
        run: |
          npm install -g firebase-tools
          if [ -n "$APP_DISTRIBUTION_GROUP" ]; then
            TARGET_FLAG="--groups"
            TARGET_VALUE="$APP_DISTRIBUTION_GROUP"
          else
            TARGET_FLAG="--testers"
            TARGET_VALUE="manideepbiswas21@gmail.com"
          fi
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app 1:679019957650:android:8c6cb7576949211947c54b \
            --project family-super-app-3bf1c \
            "$TARGET_FLAG" "$TARGET_VALUE" \
            --release-notes "Auto build from ${{ github.sha }}"
