name: family_super_app
description: FAM — private family hub (chat, diary, tasks, timeline, calendar, vault, games, Firebase).
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1

  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.7
  cloud_functions: ^5.1.4
  firebase_messaging: ^15.1.6
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.5.2

  google_sign_in: ^6.2.2

  go_router: ^14.6.2
  flutter_animate: ^4.5.2
  app_links: ^6.4.0
  shared_preferences: ^2.3.2

  # Play Billing for the freemium subscription (AI digest, extra vault
  # storage, AI quiz) — see docs/BILLING_SETUP.md for the Play Console side
  # (subscription product + Play Developer API access) this depends on.
  in_app_purchase: ^3.2.0

  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  rxdart: ^0.28.0
  table_calendar: ^3.1.3
  image_picker: ^1.1.2

  flutter_local_notifications: ^18.0.1
  onesignal_flutter: ^5.3.4
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  path_provider: ^2.1.5
  http: ^1.5.0
  fl_chart: ^0.69.0
  timezone: ^0.9.4
  # Voice-recording packages (`record`, `just_audio`) are added in P2 once
  # we ship voice notes — current `record` 5.x has a broken Linux platform
  # implementation that fails the Android debug build.

  # --- Revamp: free-tier intelligence + on-device ML (all $0 — see docs/REVAMP_ROADMAP.md) ---
  # Firebase AI Logic client SDK, used with the "Gemini Developer API" backend,
  # which runs on the free Spark plan (no Blaze/billing needed). See
  # docs/AI_LOGIC_SETUP.md before flipping AppFlags.aiDigestEnabled on.
  firebase_ai: ^2.3.0
  # On-device OCR + entity extraction for the vault — no network call, no quota.
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_entity_extraction: ^0.15.0
  # On-device text-to-speech for the Sunday weekly-recap "Play recap" button
  # — reads the AI digest aloud, no server cost, no new billing.
  flutter_tts: ^4.2.5
  # Android/iOS home-screen widget (open task count + family name) — see
  # lib/core/widget/home_widget_sync.dart and
  # android/app/src/main/kotlin/.../FamWidgetProvider.kt.
  home_widget: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
